<div class="card">
  <div class="row space-between">
    <h2 class="card-title">Recent Activity</h2>
    <div class="row">
      <button class="btn btn-primary" (click)="openModal()">Create</button>
      <button class="btn btn-outline">Export</button>
    </div>
  </div>

  <div class="mt-16"></div>

  <div class="row">
    <input class="input" type="text" placeholder="Filter results..." style="max-width: 320px;">
    <span class="tag tag-success">Healthy</span>
    <span class="tag tag-danger">Issues</span>
  </div>

  <div class="mt-16"></div>

  <table class="table">
    <thead>
      <tr>
        <th style="width:36px;">
          <input type="checkbox" aria-label="Select all" (change)="toggleAll($event, tbodyRef!)">
        </th>
        <th>Name</th>
        <th>Status</th>
        <th>Updated</th>
        <th style="text-align:right;">Actions</th>
      </tr>
    </thead>
    <tbody #tbodyRef>
      <tr>
        <td><input type="checkbox" aria-label="Select row 1"></td>
        <td>Gateway Alpha</td>
        <td><span class="tag tag-success">Completed</span></td>
        <td>Today 09:24</td>
        <td style="text-align:right;"><button class="btn btn-tertiary">Edit</button></td>
      </tr>
      <tr>
        <td><input type="checkbox" aria-label="Select row 2"></td>
        <td>Sensor Pack B</td>
        <td><span class="tag tag-danger">Failed</span></td>
        <td>Yesterday 17:52</td>
        <td style="text-align:right;"><button class="btn btn-tertiary">Retry</button></td>
      </tr>
      <tr>
        <td><input type="checkbox" aria-label="Select row 3"></td>
        <td>Router C-19</td>
        <td><span class="tag tag-success">Completed</span></td>
        <td>2 days ago</td>
        <td style="text-align:right;"><button class="btn btn-tertiary">Details</button></td>
      </tr>
    </tbody>
  </table>
</div>

<!-- Modal -->
<div class="modal-backdrop" [class.open]="modalOpen" [attr.aria-hidden]="!modalOpen" (click)="closeModal()">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <div class="modal-title" id="modalTitle">Create Item</div>
      <button class="btn btn-tertiary" aria-label="Close" (click)="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="row" style="gap: 12px; flex-wrap: wrap;">
        <label style="min-width: 120px; font-size: var(--fs-14); color: var(--text-secondary);">Name</label>
        <input class="input" type="text" placeholder="Enter a name" />
      </div>
      <div class="mt-16"></div>
      <div class="row" style="gap: 12px; flex-wrap: wrap;">
        <label style="min-width: 120px; font-size: var(--fs-14); color: var(--text-secondary);">Type</label>
        <select class="input" style="height: 40px;">
          <option>Gateway</option>
          <option>Sensor</option>
          <option>Router</option>
        </select>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-tertiary" (click)="closeModal()">Cancel</button>
      <button class="btn btn-primary" (click)="closeModal()">Create</button>
    </div>
  </div>
</div>
